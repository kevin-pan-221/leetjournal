name: Build macOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Require release tag and Apple credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node scripts/check-release.mjs
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check:all
      - name: Build signed and notarized installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          args: --target aarch64-apple-darwin --bundles app,dmg
          includeUpdaterJson: false
      - name: Verify signature, notarization, and disk image
        shell: bash
        run: |
          set -euo pipefail
          app='src-tauri/target/aarch64-apple-darwin/release/bundle/macos/LeetJournal.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          cd src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          images=(*.dmg)
          [[ ${#images[@]} -eq 1 && -f "${images[0]}" ]]
          hdiutil verify "${images[0]}"
          shasum -a 256 "${images[0]}" > SHA256SUMS.txt
      # No release is created until every verification above has passed.
      # Existing releases are never overwritten by a rerun.
      - name: Create verified draft for installation testing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --draft --title "LeetJournal $GITHUB_REF_NAME" \
            --notes 'For Apple Silicon Macs: download the .dmg, open it, and drag LeetJournal into Applications. No developer tools required. Developer ID signed and Apple-notarized. LM Studio, AI models, and Spotify are optional and installed separately.' \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg \
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
      - name: Retain verified installer
        uses: actions/upload-artifact@v4
        with:
          name: LeetJournal-macOS-Apple-Silicon
          path: |
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
